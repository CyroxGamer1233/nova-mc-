name: Build NovaMC Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout NovaMC
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build NovaMC
        run: mvn clean package

      - name: Find NovaMC JAR
        shell: powershell
        run: |
          Get-ChildItem -Path target -Filter *.jar |
            Where-Object { $_.Name -notlike "original-*" } |
            Select-Object FullName

      - name: Create Windows EXE
        shell: powershell
        run: |
          $jar = Get-ChildItem -Path target -Filter *.jar |
            Where-Object { $_.Name -notlike "original-*" } |
            Select-Object -First 1

          if (-not $jar) {
            Write-Error "NovaMC JAR not found!"
            exit 1
          }

          jpackage `
            --type exe `
            --name NovaMC `
            --input target `
            --main-jar $jar.Name `
            --main-class com.novamc.Main `
            --dest dist `
            --app-version 1.0.0 `
            --vendor "NovaMC" `
            --win-shortcut `
            --win-menu

      - name: Upload NovaMC EXE
        uses: actions/upload-artifact@v4
        with:
          name: NovaMC-Windows
          path: dist/*.exe
          
