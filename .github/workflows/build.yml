name: Build NovaMC Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build NovaMC
        run: mvn clean package

      - name: Create app directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path app

          Copy-Item target\NovaMC-1.0.0.jar app\NovaMC.jar

      - name: Create Windows EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist

          jpackage `
            --type exe `
            --name NovaMC `
            --input app `
            --main-jar NovaMC.jar `
            --main-class com.novamc.Main `
            --dest dist `
            --app-version 1.0.0 `
            --vendor "NovaMC" `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser `
            --verbose

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NovaMC-Windows
          path: dist\*.exe
